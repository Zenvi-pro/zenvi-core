<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directors Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .actions-bar {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .actions-bar .search-box {
            margin-right: 15px;
        }

        .search-box {
            -webkit-flex: 1;
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-box::-webkit-input-placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-box:focus {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .directors-grid {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin: -10px;
            margin-bottom: 20px;
        }

        .director-card {
            width: 280px;
            margin: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .director-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f093fb, #f5576c);
            -webkit-transform: scaleX(0);
            transform: scaleX(0);
        }

        .director-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .director-card:hover::before {
            -webkit-transform: scaleX(1);
            transform: scaleX(1);
        }

        .director-card.selected {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .director-card.selected::before {
            -webkit-transform: scaleX(1);
            transform: scaleX(1);
        }

        .card-header {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .director-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            -webkit-flex: 1;
            flex: 1;
        }

        .delete-btn {
            background: rgba(255, 59, 48, 0.2);
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 0.4);
        }

        .director-author {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .director-description {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .director-tags {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            margin: 0 6px 6px 0;
        }

        .director-expertise {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .selection-footer {
            position: sticky;
            bottom: 0;
            background: rgba(102, 126, 234, 0.95);
            padding: 20px;
            margin: -20px;
            margin-top: 20px;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .selected-count {
            font-size: 16px;
            font-weight: 600;
        }

        .analyze-btn {
            padding: 15px 40px;
            font-size: 16px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .analyze-btn:hover {
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
            width: 100%;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .checkbox-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 24px;
            height: 24px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            position: relative;
        }

        .checkbox-wrapper input[type="checkbox"]:checked {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-color: transparent;
        }

        .checkbox-wrapper input[type="checkbox"]:checked::after {
            content: '\2713';
            position: absolute;
            color: white;
            font-size: 16px;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#127916; AI Directors</h1>
            <p>Select directors to analyze your project with AI-powered insights</p>
        </div>

        <div class="actions-bar">
            <input type="text" class="search-box" id="searchBox" placeholder="Search directors...">
            <button class="btn btn-secondary" onclick="openMarketplace()">&#128722; Marketplace</button>
        </div>

        <div class="directors-grid" id="directorsGrid">
            <div class="empty-state">
                <h2>Loading directors...</h2>
                <p>Please wait while we load available directors</p>
            </div>
        </div>

        <div class="selection-footer">
            <div class="selected-count" id="selectedCount">No directors selected</div>
            <button class="btn btn-primary analyze-btn" id="analyzeBtn" onclick="analyzeWithDirectors()" disabled>
                &#10024; Analyze Project
            </button>
        </div>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        var bridge = null;
        var directors = [];
        var selectedDirectors = {};

        function selHas(id) {
            return Object.prototype.hasOwnProperty.call(selectedDirectors, id);
        }
        function selToggle(id) {
            if (selHas(id)) {
                delete selectedDirectors[id];
            } else {
                selectedDirectors[id] = true;
            }
        }
        function selKeys() {
            var keys = [];
            for (var k in selectedDirectors) {
                if (selectedDirectors.hasOwnProperty(k)) {
                    keys.push(k);
                }
            }
            return keys;
        }
        function selCount() {
            var n = 0;
            for (var k in selectedDirectors) {
                if (selectedDirectors.hasOwnProperty(k)) {
                    n++;
                }
            }
            return n;
        }

        function escapeHtml(text) {
            if (text == null) return '';
            var div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function tagsHtml(d) {
            var tags = d.tags || [];
            var parts = [];
            var lim = Math.min(4, tags.length);
            var i;
            for (i = 0; i < lim; i++) {
                parts.push('<span class="tag">' + escapeHtml(tags[i]) + '</span>');
            }
            return parts.join('');
        }

        function expertiseLine(d) {
            var ex = d.expertise || [];
            var slice = ex.slice(0, 3);
            return slice.join(', ');
        }

        function connectDirectorPanel() {
            if (typeof qt !== 'undefined' && qt.webChannelTransport && typeof QWebChannel !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    wireDirectorPanel(channel.objects.directorPanelBridge);
                });
                return;
            }
            if (typeof directorPanelBridge !== 'undefined') {
                wireDirectorPanel(directorPanelBridge);
                return;
            }
            setTimeout(connectDirectorPanel, 30);
        }

        function wireDirectorPanel(b) {
            bridge = b;
            bridge.directorsLoaded.connect(function(directorsJson) {
                directors = JSON.parse(directorsJson);
                renderDirectors('');
            });
            bridge.loadDirectors();
        }

        connectDirectorPanel();

        function directorMatchesFilter(d, filterLower) {
            if (!filterLower) return true;
            if (d.name.toLowerCase().indexOf(filterLower) !== -1) return true;
            if (d.description.toLowerCase().indexOf(filterLower) !== -1) return true;
            var tags = d.tags || [];
            var i;
            for (i = 0; i < tags.length; i++) {
                if (tags[i].toLowerCase().indexOf(filterLower) !== -1) return true;
            }
            var ex = d.expertise || [];
            for (i = 0; i < ex.length; i++) {
                if (ex[i].toLowerCase().indexOf(filterLower) !== -1) return true;
            }
            return false;
        }

        function renderDirectors(filter) {
            filter = filter || '';
            var grid = document.getElementById('directorsGrid');
            var filterLower = filter.toLowerCase();

            var filteredDirectors = directors.filter(function(d) {
                return directorMatchesFilter(d, filterLower);
            });

            var html;
            var j;
            if (filteredDirectors.length === 0) {
                html = '<div class="empty-state"><h2>No directors found</h2><p>';
                html += filter ? 'Try a different search term' : 'Click Marketplace to add directors';
                html += '</p></div>';
                grid.innerHTML = html;
                updateSelectedCount();
                return;
            }

            html = '';
            for (j = 0; j < filteredDirectors.length; j++) {
                var director = filteredDirectors[j];
                var isSelected = selHas(director.id);
                var idJson = JSON.stringify(director.id);
                html += '<div class="director-card' + (isSelected ? ' selected' : '') + '"';
                html += ' onclick="toggleDirector(' + idJson + ')" data-id="' + escapeHtml(director.id) + '">';
                html += '<div class="card-header"><div>';
                html += '<div class="director-name">' + escapeHtml(director.name) + '</div>';
                html += '<div class="director-author">by ' + escapeHtml(director.author) + '</div></div>';
                html += '<button class="delete-btn" onclick="deleteDirector(event, ' + idJson + ')" title="Delete director">&#128465;</button>';
                html += '</div>';
                html += '<div class="director-description">' + escapeHtml(director.description) + '</div>';
                html += '<div class="director-tags">' + tagsHtml(director) + '</div>';
                html += '<div class="director-expertise"><strong>Expertise:</strong> ' + escapeHtml(expertiseLine(director)) + '</div>';
                html += '<div class="checkbox-wrapper"><input type="checkbox" ';
                html += isSelected ? 'checked ' : '';
                html += 'onclick="event.stopPropagation()"></div></div>';
            }
            grid.innerHTML = html;
            updateSelectedCount();
        }

        function toggleDirector(directorId) {
            selToggle(directorId);
            renderDirectors(document.getElementById('searchBox').value);
        }

        function deleteDirector(event, directorId) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this director? You can add it back from the Marketplace.')) {
                if (bridge && bridge.deleteDirector) {
                    bridge.deleteDirector(directorId);
                    directors = directors.filter(function(d) { return d.id !== directorId; });
                    if (selHas(directorId)) {
                        delete selectedDirectors[directorId];
                    }
                    renderDirectors(document.getElementById('searchBox').value);
                }
            }
        }

        function updateSelectedCount() {
            var count = selCount();
            var countEl = document.getElementById('selectedCount');
            var analyzeBtn = document.getElementById('analyzeBtn');
            if (count === 0) {
                countEl.textContent = 'No directors selected';
                analyzeBtn.disabled = true;
            } else {
                countEl.textContent = count + ' director' + (count > 1 ? 's' : '') + ' selected';
                analyzeBtn.disabled = false;
            }
        }

        function analyzeWithDirectors() {
            if (selCount() === 0) return;
            var directorIds = selKeys();
            if (bridge && bridge.selectDirectors) {
                bridge.selectDirectors(JSON.stringify(directorIds));
            }
        }

        function openMarketplace() {
            if (bridge && bridge.openMarketplace) {
                bridge.openMarketplace();
            }
        }

        document.getElementById('searchBox').addEventListener('input', function(e) {
            renderDirectors(e.target.value);
        });
    </script>
</body>
</html>
