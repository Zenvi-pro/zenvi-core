<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="95%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="55%" stop-color="#0C1018"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="labelBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="40%" stop-color="#12151C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#141820" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="topHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3275F8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3275F8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3275F8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#0A0A0A"/>
  <rect width="600" height="450" fill="url(#field)"/>
  <rect x="180" y="14" width="240" height="1" fill="url(#topHair)"/>

  <g transform="translate(300, 48)">
    <g transform="translate(-93, -11)" fill="none" stroke="#3275F8" stroke-width="1.5">
      <rect x="0" y="0" width="12" height="12"/>
      <rect x="5" y="5" width="12" height="12"/>
      <rect x="10" y="10" width="12" height="12"/>
    </g>
    <text x="12" y="8" text-anchor="middle"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="500" fill="#F4F6FA"
          letter-spacing="8">ZENVI</text>
  </g>

  <text x="300" y="82" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="10" font-weight="400" fill="#8B93A7"
        letter-spacing="3.5">DRAG TO INSTALL</text>

  <g transform="translate(300, 210)" fill="none" stroke="#3275F8" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round">
    <line x1="-34" y1="0" x2="26" y2="0"/>
    <polyline points="14,-8 30,0 14,8"/>
  </g>

  <rect x="0" y="280" width="600" height="170" fill="url(#labelBand)"/>

  <text x="300" y="428" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="10" font-weight="400" fill="#5A6275"
        letter-spacing="1.5">zenvi.pro</text>
</svg>
