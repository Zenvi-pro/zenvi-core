# ─────────────────────────────────────────────────────────────────────────────
# Zenvi — Release Workflow
#
# Triggers when a version tag (v*.*.*) is pushed. Builds platform-specific
# installers and publishes them as a GitHub Release so the in-app auto-updater
# can pick them up.
#
# Asset naming convention expected by the auto-updater:
#   Linux   → Zenvi-v<VER>-x86_64.AppImage
#   macOS   → Zenvi-v<VER>-x86_64.dmg   (Intel)
#             Zenvi-v<VER>-arm64.dmg     (Apple Silicon)
#   Windows → Zenvi-v<VER>-x86_64.exe
# ─────────────────────────────────────────────────────────────────────────────
name: Zenvi Production Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # needed for creating releases & uploading assets
  id-token: write # Azure OIDC (Artifact Signing) on Windows job when secrets below are set

env:
  # Parsed from src/classes/info.py at build time
  APP_NAME: Zenvi

jobs:

  # ── 1. Read the version from source so every job can reference it ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from info.py
        id: ver
        run: |
          VER=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/classes/info.py').read_text()
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${VER}"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Linux build (AppImage + .deb) ──────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:openshot.developers/libopenshot-daily
          sudo apt-get update
          sudo apt-get install -y \
            libopenshot-audio-dev libopenshot-dev python3-openshot \
            libfuse2 desktop-file-utils

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Freeze with cx_Freeze
        run: python3 freeze.py build --git-branch=production

      - name: Smoke test frozen zenvi
        run: |
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.linux-*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.linux-* not found"
            ls -la build/ || true
            exit 1
          fi
          echo "Frozen directory: $FROZEN_DIR"
          # Force PyOpenGL to use a headless/null platform on CI runners that lack GLX
          export PYOPENGL_PLATFORM=null
          "$FROZEN_DIR/zenvi" -V 2>&1 || "$FROZEN_DIR/zenvi" --version 2>&1 || {
            echo "::error::Frozen zenvi failed basic startup/version check"
            exit 1
          }

      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool && chmod +x appimagetool

          # Create AppDir structure
          APPDIR="Zenvi.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/metainfo"

          # Copy frozen build
          cp -r build/exe.linux-*/* "$APPDIR/usr/bin/"

          # Desktop + AppStream (Zenvi only — do not ship legacy OpenShot .desktop files)
          DESKTOP="xdg/org.zenvi.Zenvi.desktop"
          APPDATA="xdg/org.zenvi.Zenvi.appdata.xml"
          if [ ! -f "$DESKTOP" ]; then
            echo "::error::Missing $DESKTOP"
            exit 1
          fi
          cp "$DESKTOP" "$APPDIR/usr/share/applications/"
          cp "$DESKTOP" "$APPDIR/zenvi.desktop"
          [ -f "$APPDATA" ] && cp "$APPDATA" "$APPDIR/usr/share/metainfo/"

          # Icon (same branding as installer/dmg-icon.png)
          ICON="installer/dmg-icon.png"
          if [ ! -f "$ICON" ]; then
            echo "::error::Missing packaging icon: $ICON"
            exit 1
          fi
          cp "$ICON" "$APPDIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
          cp "$ICON" "$APPDIR/zenvi.png"

          # AppRun
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/bin:$HERE/usr/bin/lib:$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/bin"
          exec "$HERE/usr/bin/zenvi" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" \
            "Zenvi-v${VER}-x86_64.AppImage"

      - name: Build .deb package
        run: |
          DEB_DIR="zenvi_${VER}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/zenvi"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.linux-*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.linux-* not found"
            ls -la build/ || true
            exit 1
          fi
          echo "Using frozen directory: $FROZEN_DIR"

          # Copy frozen build into /opt/zenvi (self-contained layout)
          cp -r "$FROZEN_DIR"/* "$DEB_DIR/opt/zenvi/"

          # Launcher script
          cat > "$DEB_DIR/usr/bin/zenvi" << 'LAUNCHER'
          #!/bin/bash
          HERE="/opt/zenvi"
          export LD_LIBRARY_PATH="$HERE:$HERE/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH="$HERE/lib:${PYTHONPATH}"
          export QT_PLUGIN_PATH="$HERE"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$HERE/plugins/platforms"
          export OPENSSL_CONF="/dev/null"
          exec "$HERE/zenvi" "$@"
          LAUNCHER
          chmod +x "$DEB_DIR/usr/bin/zenvi"

          # Desktop file (Zenvi only)
          DESKTOP="xdg/org.zenvi.Zenvi.desktop"
          if [ ! -f "$DESKTOP" ]; then
            echo "::error::Missing $DESKTOP"
            exit 1
          fi
          cp "$DESKTOP" "$DEB_DIR/usr/share/applications/"

          # Icon (same branding as installer/dmg-icon.png)
          ICON="installer/dmg-icon.png"
          if [ ! -f "$ICON" ]; then
            echo "::error::Missing packaging icon: $ICON"
            exit 1
          fi
          cp "$ICON" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"

          # Control file
          cat > "$DEB_DIR/DEBIAN/control" << CTRL
          Package: zenvi
          Version: ${VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: python3
          Maintainer: Zenvi Team <team@zenvi.org>
          Description: Zenvi Video Editor
           Create and edit stunning videos, films, and animations.
          CTRL

          dpkg-deb --build "$DEB_DIR" "Zenvi-v${VER}-x86_64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            Zenvi-v*.AppImage
            Zenvi-v*.deb

  # ── 3. macOS build (.dmg) ─────────────────────────────────────────────
  # Produces two DMGs: Intel (x86_64) and Apple Silicon (arm64).
  # Both jobs run on macos-15 (Apple Silicon). macos-13 (last Intel runner)
  # was retired by GitHub. x86_64 build uses Rosetta 2 Python (architecture: x64)
  # so cx_Freeze produces an x86_64-native frozen app that runs on Intel Macs.
  # arm64 build uses the native Apple Silicon Python.
  #
  # arm64: libopenshot is built from source with matching Python ABI and bundled.
  # x86_64: libopenshot is NOT bundled (cross-compiling C++ via Rosetta is complex;
  # Homebrew Qt5/FFmpeg bottles are arm64-only on macos-15 runners).
  # Full x86_64 video support will come with proper Intel build infrastructure.
  build-macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15   # Apple Silicon; x64 Python via Rosetta → x86_64 app
            arch: x86_64
          - runner: macos-14   # macOS 14 Sonoma arm64; targets macOS 14+ users
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # x86_64: force Rosetta Python so the frozen app is x86_64.
      - name: Set up Python 3.11 (x86_64, via Rosetta)
        if: matrix.arch == 'x86_64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      # arm64: use native Apple Silicon Python (no architecture override).
      - name: Set up Python 3.11 (arm64, native)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build libopenshot from source only for arm64 (native build, no cross-compilation).
      # x86_64 skips this: cross-compiling C++ for x86_64 via Rosetta is complex and
      # the Homebrew Qt5/ffmpeg bottles are arm64-only on macos-15 runners.
      - name: Cache libopenshot build
        id: cache-libopenshot
        if: matrix.arch == 'arm64'
        uses: actions/cache@v4
        with:
          path: /tmp/libopenshot-install
          key: libopenshot-v0.7.0-audio-v0.6.0-arm64-macos14-py311-v4

      - name: Build libopenshot from source (arm64 only)
        if: matrix.arch == 'arm64' && steps.cache-libopenshot.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          INSTALL_PREFIX="/tmp/libopenshot-install"
          mkdir -p "$INSTALL_PREFIX"

          # Install build dependencies (Homebrew arm64 bottles)
          # cppzmq provides zmq.hpp C++ header (separate from zeromq's libzmq/zmq.h)
          brew install swig zeromq cppzmq libsamplerate qt@5 || true
          brew install libomp
          brew install ffmpeg 2>/dev/null || true

          QT5_PREFIX="$(brew --prefix qt@5)"
          LIBOMP_PREFIX="$(brew --prefix libomp)"

          # Build libopenshot-audio v0.6.0 (required by libopenshot 0.7.x: OpenShotAudio >= 0.6.0)
          git clone --depth=1 --branch v0.6.0 \
            https://github.com/OpenShot/libopenshot-audio.git /tmp/libopenshot-audio

          # Apply zenvi-core Mac patches (removes -framework AGL — Apple removed
          # AGL in macOS 10.14; modern SDKs may not provide it at all).
          # Patch is tag-locked to v0.5.0; v0.6.0+ may already incorporate the fix.
          # Tolerant: skip if the patch no longer applies cleanly.
          git -C /tmp/libopenshot-audio apply --check --whitespace=nowarn \
            "$GITHUB_WORKSPACE/installer/mac-patches/libopenshot-audio-v0.5.0-mac.patch" 2>/dev/null \
            && git -C /tmp/libopenshot-audio apply --whitespace=nowarn \
                 "$GITHUB_WORKSPACE/installer/mac-patches/libopenshot-audio-v0.5.0-mac.patch" \
            || echo "libopenshot-audio v0.5.0 patch did not apply (likely already fixed in v0.6.0+)"

          cmake -S /tmp/libopenshot-audio -B /tmp/libopenshot-audio/build \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/libopenshot-audio/build --parallel $(sysctl -n hw.logicalcpu)
          cmake --install /tmp/libopenshot-audio/build

          # Build libopenshot v0.7.0 with Python bindings (OpenMP required — use Homebrew libomp)
          git clone --depth=1 --branch v0.7.0 \
            https://github.com/OpenShot/libopenshot.git /tmp/libopenshot

          # Tolerant patching: each step is a no-op if upstream v0.7.0 already
          # incorporated the fix (which it does for several of these).
          # 1. Remove avresample (dropped in FFmpeg 5+).
          find /tmp/libopenshot -name "CMakeLists.txt" -o -name "*.cmake" | \
            xargs grep -l "avresample" 2>/dev/null | \
            xargs sed -i '' 's/ avresample//g' || true

          # 2. FFmpeg 7/8 compat (FF_PROFILE_*, side-data, AVCodec config lists).
          python3 "$GITHUB_WORKSPACE/installer/patch-libopenshot-ffmpeg.py" /tmp/libopenshot
          # Note: SWR channel layout (the FFmpeg 8 av_opt_set_chlayout fix) is
          # included in libopenshot v0.7.0 upstream — no local patch needed.

          cmake -S /tmp/libopenshot -B /tmp/libopenshot/build \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_RUBY=OFF \
            -DENABLE_JAVA=OFF \
            -DENABLE_PYTHON=ON \
            -DENABLE_OPENCV=OFF \
            -DENABLE_MAGICK=OFF \
            -DPython3_EXECUTABLE="$(which python3)" \
            -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations" \
            -DOpenMP_ROOT="$LIBOMP_PREFIX" \
            -DCMAKE_PREFIX_PATH="$INSTALL_PREFIX;$QT5_PREFIX;$LIBOMP_PREFIX"
          cmake --build /tmp/libopenshot/build --parallel $(sysctl -n hw.logicalcpu)
          cmake --install /tmp/libopenshot/build

      - name: Verify libopenshot Python bindings (arm64)
        if: matrix.arch == 'arm64'
        run: |
          INSTALL_PREFIX="/tmp/libopenshot-install"
          PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")

          # cmake installs Python bindings to $INSTALL_PREFIX/python (PYTHON_MODULE_PATH default)
          # Fall back to site-packages if not found there.
          if [ -f "$INSTALL_PREFIX/python/openshot.py" ] || [ -f "$INSTALL_PREFIX/python/_openshot.so" ]; then
            PYROOT="$INSTALL_PREFIX/python"
          else
            PYROOT="$INSTALL_PREFIX/lib/python${PYVER}/site-packages"
          fi

          echo "ZENVI_OPENSHOT_PYROOT=$PYROOT" >> $GITHUB_ENV
          echo "ZENVI_OPENSHOT_INSTALL=$INSTALL_PREFIX" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$INSTALL_PREFIX/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

          # Verify the binding is importable (soft check — freeze.py uses filesystem
          # discovery via ZENVI_OPENSHOT_PYROOT, so a dlopen failure here is non-fatal)
          DYLD_LIBRARY_PATH="$INSTALL_PREFIX/lib" PYTHONPATH="$PYROOT" \
            python3 -c "import openshot; print(f'libopenshot version: {openshot.OPENSHOT_VERSION_FULL}')" \
            || echo "::warning::openshot import failed (dlopen issue) — freeze.py will use filesystem discovery"

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyobjc-framework-Cocoa 2>/dev/null || true

      - name: Freeze with cx_Freeze
        run: |
          python3 freeze.py build --git-branch=production

      # Fix OpenSSL dylib mismatch (arm64 only).
      # cx_Freeze may bundle libssl.3.dylib from the Python toolchain (OpenSSL 3.2+)
      # but libcrypto.3.dylib from Homebrew (OpenSSL 3.0.x) because other bundled
      # dylibs (ffmpeg, qt) also depend on libcrypto and cx_Freeze picks up whichever
      # copy it resolves first. The mismatch causes:
      #   Symbol not found: _BIO_ADDR_copy
      #   Referenced from: libssl.3.dylib
      #   Expected in: libcrypto.3.dylib
      # Fix: after freeze, replace libcrypto with the one from the same source as libssl.
      - name: Fix OpenSSL dylib mismatch in frozen build (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -eo pipefail
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.*' | head -1)
          [ -n "$FROZEN_DIR" ] || { echo "No frozen dir, skipping"; exit 0; }

          # Python's own lib dir — where its bundled libssl + libcrypto live.
          # actions/setup-python installs a self-contained Python whose OpenSSL
          # dylibs are co-located with libpython (same LIBDIR as sysconfig reports).
          PY_LIBDIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          echo "Python LIBDIR: $PY_LIBDIR"

          # _ssl.so links against its own libssl; trace the exact path.
          SSL_SO=$(python3 -c "import _ssl, os; print(os.path.realpath(_ssl.__file__))")
          echo "_ssl.so: $SSL_SO"

          # Get raw libssl reference from _ssl.so (may be @rpath/..., @loader_path/..., or absolute)
          LIBSSL_RAW=$(otool -L "$SSL_SO" 2>/dev/null | awk '/libssl\.3\.dylib/{print $1; exit}')
          echo "libssl raw ref: $LIBSSL_RAW"

          # Resolve the raw path to an actual file
          resolve_dylib() {
            local raw="$1" base so_dir="$2"
            base="$(basename "$raw")"
            # 1. Try replacing @rpath/name with PY_LIBDIR/name
            if [[ "$raw" == @rpath/* ]]; then
              local candidate="$PY_LIBDIR/$base"
              [ -f "$candidate" ] && echo "$candidate" && return
              # Also try each rpath entry embedded in the .so
              while IFS= read -r rp; do
                [ -f "$rp/$base" ] && echo "$rp/$base" && return
              done < <(otool -l "$SSL_SO" 2>/dev/null | awk '/LC_RPATH/{f=1} f && /path /{print $2; f=0}')
            elif [ -f "$raw" ]; then
              echo "$raw" && return
            fi
            # 2. Fallback: search near the .so itself
            [ -f "$(dirname "$so_dir")/$base" ] && echo "$(dirname "$so_dir")/$base" && return
            echo ""
          }

          LIBSSL_PATH="$(resolve_dylib "$LIBSSL_RAW" "$SSL_SO")"
          echo "Resolved libssl: $LIBSSL_PATH"

          if [ -z "$LIBSSL_PATH" ] || [ ! -f "$LIBSSL_PATH" ]; then
            echo "WARNING: Cannot locate Python's libssl — falling back to PY_LIBDIR"
            LIBSSL_PATH="$PY_LIBDIR/libssl.3.dylib"
          fi

          if [ ! -f "$LIBSSL_PATH" ]; then
            echo "libssl not found at $LIBSSL_PATH; skipping OpenSSL fix"
            exit 0
          fi

          # Derive the matching libcrypto from the same directory as libssl
          LIBSSL_DIR="$(dirname "$LIBSSL_PATH")"
          LIBCRYPTO_PATH="$LIBSSL_DIR/libcrypto.3.dylib"
          if [ ! -f "$LIBCRYPTO_PATH" ]; then
            # libssl's internal libcrypto reference
            LIBCRYPTO_RAW=$(otool -L "$LIBSSL_PATH" 2>/dev/null | awk '/libcrypto\.3\.dylib/{print $1; exit}')
            echo "libcrypto raw ref from libssl: $LIBCRYPTO_RAW"
            if [[ "$LIBCRYPTO_RAW" == @rpath/* ]]; then
              LIBCRYPTO_PATH="$PY_LIBDIR/$(basename "$LIBCRYPTO_RAW")"
            elif [ -f "$LIBCRYPTO_RAW" ]; then
              LIBCRYPTO_PATH="$LIBCRYPTO_RAW"
            fi
          fi

          if [ ! -f "$LIBCRYPTO_PATH" ]; then
            echo "Cannot find matching libcrypto; skipping OpenSSL fix"
            exit 0
          fi

          echo "Matched OpenSSL pair:"
          file "$LIBSSL_PATH" "$LIBCRYPTO_PATH"

          # Replace libssl + libcrypto in the frozen build with the matched pair.
          # cx_Freeze may have placed them in the exe root and/or lib/ subdir.
          REPLACED=0
          for search_dir in "$FROZEN_DIR" "$FROZEN_DIR/lib"; do
            [ -d "$search_dir" ] || continue
            if [ -f "$search_dir/libssl.3.dylib" ]; then
              echo "Replacing $search_dir/libssl.3.dylib"
              chmod u+w "$search_dir/libssl.3.dylib" 2>/dev/null || true
              cp -f "$LIBSSL_PATH" "$search_dir/libssl.3.dylib"
              # Fix the dylib ID so it's self-referencing correctly inside the bundle
              install_name_tool -id "@executable_path/libssl.3.dylib" "$search_dir/libssl.3.dylib" 2>/dev/null || true
              # Rewrite any absolute dep references in libssl to @loader_path
              # (e.g. /Library/Frameworks/Python.framework/.../libcrypto.3.dylib → @loader_path/libcrypto.3.dylib)
              while IFS= read -r dep; do
                if [[ "$dep" != @* && "$dep" != /usr/* && "$dep" != /System/* ]]; then
                  dep_name="$(basename "$dep")"
                  install_name_tool -change "$dep" "@loader_path/$dep_name" "$search_dir/libssl.3.dylib" 2>/dev/null || true
                  echo "  Rewrote libssl dep: $dep -> @loader_path/$dep_name"
                fi
              done < <(otool -L "$search_dir/libssl.3.dylib" 2>/dev/null | awk 'NR>1{print $1}' | sort -u)
              REPLACED=$((REPLACED+1))
            fi
            if [ -f "$search_dir/libcrypto.3.dylib" ]; then
              echo "Replacing $search_dir/libcrypto.3.dylib"
              chmod u+w "$search_dir/libcrypto.3.dylib" 2>/dev/null || true
              cp -f "$LIBCRYPTO_PATH" "$search_dir/libcrypto.3.dylib"
              install_name_tool -id "@executable_path/libcrypto.3.dylib" "$search_dir/libcrypto.3.dylib" 2>/dev/null || true
              REPLACED=$((REPLACED+1))
            fi
          done

          # If libcrypto.3.dylib wasn't in the frozen build at all, add it
          if ! find "$FROZEN_DIR" -name 'libcrypto.3.dylib' | grep -q .; then
            echo "libcrypto.3.dylib missing from frozen build — adding it"
            cp "$LIBCRYPTO_PATH" "$FROZEN_DIR/libcrypto.3.dylib"
            install_name_tool -id "@executable_path/libcrypto.3.dylib" "$FROZEN_DIR/libcrypto.3.dylib" 2>/dev/null || true
            REPLACED=$((REPLACED+1))
          fi

          echo "OpenSSL fix: updated $REPLACED dylib location(s)"

      # Fix Mach-O rpath references in the frozen build (arm64 only).
      # _openshot.so is built against system/CI-local paths (Homebrew Qt/FFmpeg,
      # /tmp/libopenshot-install, Python.framework). These are valid on the CI
      # runner but do not exist on user machines. cx_Freeze copies the libraries
      # but does NOT rewrite the references in _openshot.so.
      # This step rewrites all absolute, non-system dep references to @loader_path
      # so they resolve correctly inside the frozen app bundle.
      - name: Fix Mach-O rpath references in frozen build (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -eo pipefail
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.*' | head -1)
          [ -n "$FROZEN_DIR" ] || { echo "No frozen dir, skipping"; exit 0; }

          python3 - "$FROZEN_DIR" <<'PYEOF'
          import os, subprocess, sys, shutil

          FROZEN_DIR = sys.argv[1]

          NON_EXEC_EXT = {'.py', '.svg', '.png', '.blend', '.a', '.pak', '.qm', '.pyc',
                          '.txt', '.jpg', '.zip', '.dat', '.conf', '.xml', '.h', '.ui',
                          '.json', '.exe', '.woff', '.html', '.css', '.js',
                          '.pyx', '.pxd', '.md', '.rst', '.cfg', '.ini', '.ts', '.pot'}
          MACH_MAGIC = {b'\xcf\xfa\xed\xfe', b'\xce\xfa\xed\xfe',
                        b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca'}

          def is_system(p):
              return (p.startswith('/usr/lib') or p.startswith('/System/') or
                      p.startswith('/Library/Apple') or p.startswith('@executable_path') or
                      p.startswith('@loader_path') or p.startswith('@rpath'))

          def get_deps(binary):
              try:
                  out = subprocess.check_output(['otool', '-L', binary],
                                                stderr=subprocess.DEVNULL).decode()
                  seen, deps = set(), []
                  for line in out.split('\n')[1:]:
                      line = line.strip()
                      if ' (architecture ' in line or not line:
                          continue
                      path = line.split('(')[0].strip()
                      if path and path not in seen:
                          seen.add(path)
                          deps.append(path)
                  return deps
              except Exception:
                  return []

          def find_in_bundle(name, frozen_dir):
              for root, dirs, files in os.walk(frozen_dir):
                  if name in files:
                      return os.path.join(root, name)
              return None

          # Pass 1: rewrite all absolute (non-system) dep references to @loader_path
          fixed = 0
          for root, dirs, files in os.walk(FROZEN_DIR):
              for basename in files:
                  fp = os.path.join(root, basename)
                  if os.path.splitext(fp)[-1].lower() in NON_EXEC_EXT or basename.startswith('.'):
                      continue
                  try:
                      with open(fp, 'rb') as f:
                          magic = f.read(4)
                      if magic not in MACH_MAGIC:
                          continue
                  except Exception:
                      continue
                  for dep in get_deps(fp):
                      if is_system(dep):
                          continue
                      dep_name = os.path.basename(dep)
                      dep_in_bundle = find_in_bundle(dep_name, FROZEN_DIR)
                      if dep_in_bundle:
                          rel = os.path.relpath(dep_in_bundle, root)
                          new_ref = '@loader_path/' + rel
                          if dep != new_ref:
                              os.chmod(fp, os.stat(fp).st_mode | 0o200)
                              ret = subprocess.call(
                                  ['install_name_tool', '-change', dep, new_ref, fp],
                                  stderr=subprocess.DEVNULL)
                              if ret == 0:
                                  print(f"OK  {os.path.relpath(fp, FROZEN_DIR)}: {dep_name} -> {new_ref}")
                                  fixed += 1
                      else:
                          print(f"MISS {os.path.relpath(fp, FROZEN_DIR)}: {dep_name} not found (from {dep})")
          print(f"Pass 1: fixed {fixed} absolute path references")

          # Pass 2: fix versioned soname references in _openshot.so
          # cmake creates versioned soname symlinks (e.g., libopenshot.17.dylib,
          # libopenshot-audio.10.dylib) but only the unversioned or full-version
          # dylib is bundled. Create the soname copies in lib/ and rewrite
          # _openshot.so's @rpath references to @loader_path.
          lib_dir = os.path.join(FROZEN_DIR, 'lib')
          os.makedirs(lib_dir, exist_ok=True)
          openshot_so = find_in_bundle('_openshot.so', FROZEN_DIR)
          if not openshot_so:
              # Try cpython-tagged name
              for root, dirs, files in os.walk(FROZEN_DIR):
                  for f in files:
                      if f.startswith('_openshot.cpython') and f.endswith('.so'):
                          openshot_so = os.path.join(root, f)
                          break
                  if openshot_so:
                      break

          # Map of versioned soname -> possible source files in bundle
          soname_fixups = [
              ('libopenshot-audio.10.dylib',
               ['libopenshot-audio.0.6.0.dylib', 'libopenshot-audio.dylib']),
              ('libopenshot.30.dylib',
               ['libopenshot.0.7.0.dylib', 'libopenshot.dylib']),
          ]
          for soname, candidates in soname_fixups:
              src = None
              for c in candidates:
                  src = find_in_bundle(c, FROZEN_DIR)
                  if src:
                      break
              if not src:
                  print(f"WARNING: source for {soname} not found in bundle")
                  continue
              soname_path = os.path.join(lib_dir, soname)
              if not os.path.exists(soname_path):
                  shutil.copy2(src, soname_path)
                  subprocess.call(
                      ['install_name_tool', '-id', f'@loader_path/{soname}', soname_path],
                      stderr=subprocess.DEVNULL)
                  print(f"Created lib/{soname} (copy of {os.path.basename(src)})")
              if openshot_so:
                  openshot_dir = os.path.dirname(openshot_so)
                  rel = os.path.relpath(soname_path, openshot_dir)
                  os.chmod(openshot_so, os.stat(openshot_so).st_mode | 0o200)
                  ret = subprocess.call(
                      ['install_name_tool', '-change', f'@rpath/{soname}',
                       f'@loader_path/{rel}', openshot_so],
                      stderr=subprocess.DEVNULL)
                  if ret == 0:
                      print(f"Fixed @rpath/{soname} in {os.path.basename(openshot_so)} -> @loader_path/{rel}")
          PYEOF

      - name: Verify openshot bindings in frozen build (arm64)
        if: matrix.arch == 'arm64'
        run: |
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.*' | head -1)
          [ -n "$FROZEN_DIR" ] || { echo "No frozen dir"; exit 0; }
          echo "--- Checking openshot bindings in frozen build ---"
          # Check for openshot.py
          if find "$FROZEN_DIR/lib" -maxdepth 1 -name 'openshot.py' | grep -q .; then
            echo "FOUND: lib/openshot.py"
          else
            echo "::warning::MISSING: lib/openshot.py — video playback will not work"
          fi
          # Check for _openshot native extension
          if find "$FROZEN_DIR/lib" -maxdepth 1 -name '_openshot*' | grep -q .; then
            echo "FOUND: _openshot native extension"
            find "$FROZEN_DIR/lib" -maxdepth 1 -name '_openshot*' -exec basename {} \;
          else
            echo "::warning::MISSING: _openshot native extension — video playback will not work"
          fi
          # Check for libopenshot dylibs
          for lib in libopenshot.dylib libopenshot-audio.dylib; do
            if find "$FROZEN_DIR" -maxdepth 1 -name "$lib" | grep -q .; then
              echo "FOUND: $lib"
            else
              echo "::warning::MISSING: $lib"
            fi
          done
          # Check _openshot.so deps are satisfied
          OPENSHOT_SO=$(find "$FROZEN_DIR/lib" -maxdepth 1 -name '_openshot*' | head -1)
          if [ -n "$OPENSHOT_SO" ]; then
            echo "--- _openshot.so dependencies ---"
            otool -L "$OPENSHOT_SO" 2>/dev/null | head -20 || true
          fi

      - name: Install Apple Developer ID certificate
        id: cert
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          EXPECTED_IDENTITY: "Developer ID Application: NILAY GOYAL (LF75V32M27)"
        run: |
          set -euo pipefail

          # Fail loudly if either secret is missing — bash -u alone won't catch
          # empty-but-defined env vars, so check explicitly.
          if [ -z "${APPLE_CERT_BASE64:-}" ]; then
            echo "::error::APPLE_CERT_BASE64 secret is empty or unset"
            exit 1
          fi
          if [ -z "${APPLE_CERT_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERT_PASSWORD secret is empty or unset"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify the signing identity we expect to use is actually in the keychain.
          # Without this, downstream codesign calls fail with a cryptic message and
          # there is no clear signal that the .p12 didn't contain what we thought.
          echo "--- Identities in signing keychain ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
                | grep -F "$EXPECTED_IDENTITY" > /dev/null; then
            echo "::error::Signing identity '$EXPECTED_IDENTITY' not found in keychain after .p12 import."
            echo "::error::Check that APPLE_CERT_BASE64 contains a Developer ID Application cert + private key, and that APPLE_CERT_PASSWORD is correct."
            exit 1
          fi
          echo "Signing identity verified: $EXPECTED_IDENTITY"

      - name: Compile launch-mac Mach-O launcher
        # macOS will not codesign or notarize a bundle whose CFBundleExecutable
        # is a shell script. installer/launch-mac is a bash script (kept for
        # Linux / local dev); on macOS we replace it with a tiny compiled
        # launcher (installer/launch-mac.c) that does the same env-var setup
        # and execs the cx_Freeze-built `zenvi` binary.
        run: |
          set -euo pipefail
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.* not found"
            ls -la build/ || true
            exit 1
          fi
          # Build universal2 (x86_64 + arm64). The macos-15 runner (used for the
          # x86_64 matrix job) is Apple Silicon — without -arch x86_64, clang
          # produces an arm64-only binary that wouldn't match the Rosetta-Python
          # x86_64 'zenvi' it execs. Universal2 works for both matrix jobs.
          clang -O2 -Wall -arch x86_64 -arch arm64 \
            -o "$FROZEN_DIR/launch-mac" installer/launch-mac.c
          chmod +x "$FROZEN_DIR/launch-mac"
          echo "Compiled launch-mac:"
          file "$FROZEN_DIR/launch-mac"

      - name: Assemble .app bundle
        run: |
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.* not found"
            ls -la build/ || true
            exit 1
          fi
          echo "Frozen directory: $FROZEN_DIR"

          APP="Zenvi.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp -R "$FROZEN_DIR"/* "$APP/Contents/MacOS/"
          sed "s/VERSION/${VER}/g" installer/Info.plist > "$APP/Contents/Info.plist"
          cp "$APP/Contents/Info.plist" "$APP/Contents/Resources/Info.plist"

          [ -f "installer/zenvi.icns" ] \
            && cp "installer/zenvi.icns" "$APP/Contents/Resources/icon.icns"

          # Strip extended attributes
          xattr -cr "$APP" 2>/dev/null || true

          # Remove cx_Freeze .hash metadata directories. These are build-time integrity
          # caches not needed at runtime. They confuse codesign --deep (or any recursive
          # bundle traversal): codesign sees a dot-prefixed subdirectory next to compiled
          # modules and tries to handle it as a code subcomponent, producing the error
          # "bundle format unrecognized, invalid, or unsuitable / In subcomponent: .../.hash".
          find "$APP/Contents" -type d -name '.hash' -exec rm -rf {} + 2>/dev/null || true

          # ── Bundle restructure for codesign / notarization ────────────────
          # Apple's bundle convention says Contents/MacOS/ is for Mach-O
          # executables; everything else lives under Contents/Resources/.
          # cx_Freeze 'build' (vs bdist_mac) dumps a flat dir with .so/.dylib
          # mixed alongside .py/.pyc/icons/text. codesign then treats every
          # file under MacOS/ as part of the bundle's sealed code surface and
          # blows up with "code object is not signed at all / In subcomponent:
          # <some non-code file>" — different file each iteration, same root
          # cause. The proven fix (used upstream by openshot-qt's mac build)
          # is to move the offending subdirectories to Resources/ and link
          # them back from MacOS/. cx_Freeze's frozen binary follows the
          # symlink and finds its modules at the original path; codesign sees
          # the symlink itself as a single file and walks into Resources/
          # under its resource-sealing rules (where mixed content is fine).
          mkdir -p "$APP/Contents/Resources"

          # 1. Top-level non-Mach-O files (icons, license txt) → Resources/.
          MOVED=0
          while IFS= read -r -d '' f; do
            if ! file "$f" 2>/dev/null | grep -q "Mach-O"; then
              mv "$f" "$APP/Contents/Resources/"
              MOVED=$((MOVED + 1))
            fi
          done < <(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print0)
          echo "Moved $MOVED top-level non-Mach-O file(s) to Contents/Resources/"

          # 2. ALL non-bundle subdirectories under Contents/MacOS/ → Resources/,
          #    symlinked back. The previous hardcoded list (lib, share, plugins)
          #    missed dotted-name dirs that some packages drop in (e.g.
          #    PyQt5.uic.widget-plugins), which codesign then mistook for a
          #    malformed nested bundle: "bundle format unrecognized / In
          #    subcomponent: <that dir>". Dynamic discovery catches all of them.
          while IFS= read -r -d '' d; do
            name=$(basename "$d")
            # Skip symlinks (already-relocated entries) and anything that already
            # exists at the destination.
            [ -L "$d" ] && continue
            [ -e "$APP/Contents/Resources/$name" ] && continue
            mv "$d" "$APP/Contents/Resources/$name"
            ln -s "../Resources/$name" "$APP/Contents/MacOS/$name"
            echo "Relocated $name/: Contents/MacOS/$name → Contents/Resources/$name (symlinked back)"
          done < <(find "$APP/Contents/MacOS" -mindepth 1 -maxdepth 1 -type d -print0)

          # Make all files readable but do NOT add +x to everything.
          # chmod -R a+rx would give execute bits to text/data files (e.g.
          # frozen_application_license.txt, .hash, .json), which makes codesign
          # treat them as unsigned code objects and refuse to sign the bundle.
          chmod -R a+r "$APP/Contents/"

          # Give execute permission to Mach-O libraries and known entry points.
          find "$APP" \( -name '*.dylib' -o -name '*.so' \) -exec chmod +x {} \;
          for bin in zenvi launch launch-zenvi launch-mac; do
            [ -f "$APP/Contents/MacOS/$bin" ] && chmod +x "$APP/Contents/MacOS/$bin"
          done

          # Ad-hoc sign every Mach-O binary detected by content (magic bytes), not by
          # file extension. Extension-only filtering (.dylib/.so) misses binaries with
          # unusual names, causing codesign to fail with "code object is not signed at
          # all" for each missed file. Bundle-level signing (codesign APP) is skipped:
          # ad-hoc signing provides no Gatekeeper bypass (that needs a Developer ID
          # cert), so signing individual binaries is both necessary and sufficient to
          # prevent dyld crashes on macOS 12+.
          while IFS= read -r -d '' f; do
            file "$f" 2>/dev/null | grep -q "Mach-O" \
              && codesign -s - --force "$f" 2>/dev/null || true
          done < <(find "$APP/Contents" -type f -print0)

          echo "Bundle assembled and ad-hoc signed. Contents:"
          ls "$APP/Contents/MacOS/" | head -20

      - name: Sign .app bundle
        env:
          SIGN_IDENTITY: "Developer ID Application: NILAY GOYAL (LF75V32M27)"
        run: |
          set -euo pipefail
          APP="Zenvi.app"

          # Sign every Mach-O binary in the bundle with Developer ID.
          # Detect by content (magic bytes) rather than file extension — the
          # previous filename glob `*.dylib`|`*.so` missed the main executable
          # (Contents/MacOS/zenvi), the launch-mac launcher, and any helper
          # binaries without those extensions. When the outer bundle codesign
          # then ran without --deep, it reported "code object is not signed
          # at all" because the main executable was still only ad-hoc signed.
          SIGNED_COUNT=0
          while IFS= read -r -d '' f; do
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              codesign -s "$SIGN_IDENTITY" \
                --timestamp=http://timestamp.apple.com/ts01 \
                --entitlements installer/zenvi.entitlements \
                --options runtime --force "$f"
              SIGNED_COUNT=$((SIGNED_COUNT + 1))
            fi
          done < <(find "$APP/Contents" -type f -print0)
          echo "Signed $SIGNED_COUNT Mach-O binaries with $SIGN_IDENTITY"

          # Sign QtWebEngineProcess if present
          QWE="$APP/Contents/MacOS/share/QtWebEngineProcess.app"
          if [ -d "$QWE" ]; then
            codesign -s "$SIGN_IDENTITY" \
              --timestamp=http://timestamp.apple.com/ts01 \
              --entitlements installer/qtwebengine.entitlements \
              --options runtime --force "$QWE"
          fi

          # Sign the full app bundle with --deep --options runtime.
          # --deep is OK here because we restructured the bundle above to put
          # all non-code in Contents/Resources/, so --deep's recursive walk
          # only encounters proper sub-bundles and sealed resources. This is
          # the same approach upstream openshot-qt uses for its mac build.
          codesign -s "$SIGN_IDENTITY" \
            --timestamp=http://timestamp.apple.com/ts01 \
            --entitlements installer/zenvi.entitlements \
            --options runtime --deep --force "$APP"

          echo "Signing complete:"
          codesign -dvvv "$APP" 2>&1 | head -6
          spctl -a -vv "$APP" 2>&1 || true

      - name: Create DMG
        run: |
          DMG_NAME="Zenvi-v${VER}-${ARCH}.dmg"
          rm -rf dmgroot && mkdir -p dmgroot
          ditto "Zenvi.app" "dmgroot/Zenvi.app"
          ln -s /Applications dmgroot/Applications
          xattr -cr dmgroot/ 2>/dev/null || true

          for attempt in 1 2 3; do
            echo "hdiutil attempt $attempt ..."
            hdiutil create -volname "Zenvi" -srcfolder dmgroot \
              -ov -format UDZO "$DMG_NAME" && break
            [ "$attempt" -lt 3 ] && sleep 5
          done

          [ -f "$DMG_NAME" ] || { echo "::error::DMG not created after 3 attempts"; exit 1; }
          echo "Created $DMG_NAME ($(du -sh "$DMG_NAME" | cut -f1))"

      - name: Sign and notarize DMG
        env:
          SIGN_IDENTITY: "Developer ID Application: NILAY GOYAL (LF75V32M27)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          set -euo pipefail
          DMG_NAME="Zenvi-v${VER}-${ARCH}.dmg"

          # Fail early if notarization secrets are missing (notarytool's own error
          # for missing creds is opaque — better to surface it ourselves).
          for v in APPLE_ID APPLE_TEAM_ID APPLE_NOTARIZE_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v secret is empty or unset"
              exit 1
            fi
          done

          # Sign the DMG itself
          codesign -s "$SIGN_IDENTITY" \
            --timestamp=http://timestamp.apple.com/ts01 \
            --force "$DMG_NAME"

          # Submit for notarization and wait. Capture the submission ID so we can
          # pull the full rejection log if notarytool reports failure — without it,
          # the only output is "Status: Invalid" which tells us nothing actionable.
          SUBMIT_LOG="$RUNNER_TEMP/notarytool-submit.log"
          set +e
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --wait \
            --output-format json | tee "$SUBMIT_LOG"
          SUBMIT_EXIT=$?
          set -e

          STATUS=$(grep -o '"status":"[^"]*"' "$SUBMIT_LOG" | head -1 | cut -d'"' -f4 || echo "")
          SUBMIT_ID=$(grep -o '"id":"[^"]*"' "$SUBMIT_LOG" | head -1 | cut -d'"' -f4 || echo "")

          if [ "$STATUS" != "Accepted" ] || [ "$SUBMIT_EXIT" -ne 0 ]; then
            echo "::error::Notarization did not succeed (status=$STATUS, exit=$SUBMIT_EXIT)"
            if [ -n "$SUBMIT_ID" ]; then
              echo "--- notarytool log for submission $SUBMIT_ID ---"
              xcrun notarytool log "$SUBMIT_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_NOTARIZE_PASSWORD" || true
            fi
            exit 1
          fi

          # Staple the notarization ticket so Gatekeeper can verify offline
          xcrun stapler staple "$DMG_NAME"
          xcrun stapler validate "$DMG_NAME"
          spctl -a -t open --context context:primary-signature -vv "$DMG_NAME" || true
          echo "Notarization complete: $DMG_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: Zenvi-v*.dmg
          if-no-files-found: error

  # ── 4. Windows build (.exe) ───────────────────────────────────────────
  # MSYS2 UCRT x64 — babl is only published for ucrt64/clang*, not legacy mingw64 (packages.msys2.org).
  # freeze.py uses MSYSTEM (lowercased) for c:/msys64/<prefix>/lib/babl-0.1/ on Windows.
  build-windows:
    needs: version
    runs-on: windows-latest
    # OIDC subject for Azure login is environment-based (stable across v* tags).
    # Entra federated credential subject must be:
    #   repo:Zenvi-pro/zenvi-core:environment:release
    # (Not refs/tags/v* — partial tag wildcards often do not match in Entra.)
    environment: release
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Install the MSYS2 shell first, then pacman with retries. A single
      # setup-msys2 update+install often dies on ftp2.osuosl.org .sig files
      # ("Operation too slow. Less than 1 bytes/sec transferred the last 10 seconds").
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false

      - name: Harden pacman downloads (timeout + skip stalled OSUOSL mirror)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          grep -q '^DisableDownloadTimeout' /etc/pacman.conf \
            || sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          for f in /etc/pacman.d/mirrorlist.*; do
            [[ -f "$f" ]] || continue
            sed -i 's|^Server = https://ftp2.osuosl.org|# &|' "$f"
          done

      - name: Update MSYS2 (pass 1, runtime may kill this shell)
        # msys2-runtime upgrade terminates the shell; || true never runs when
        # the process is killed. Allow failure so the next step can finish.
        continue-on-error: true
        shell: msys2 {0}
        run: pacman -Syuu --noconfirm --disable-download-timeout

      - name: Update MSYS2 (pass 2, after runtime restart)
        continue-on-error: true
        shell: msys2 {0}
        run: pacman -Syuu --noconfirm --disable-download-timeout

      - name: Install MSYS2 packages
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pkgs=(
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-zeromq
            mingw-w64-ucrt-x86_64-cppzmq
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-pyqt5
            mingw-w64-ucrt-x86_64-python-pyzmq
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-python-cx-freeze
            mingw-w64-ucrt-x86_64-python-lief
            mingw-w64-ucrt-x86_64-python-cffi
            mingw-w64-ucrt-x86_64-python-zstandard
            mingw-w64-ucrt-x86_64-qtwebkit
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-babl
            mingw-w64-ucrt-x86_64-jsoncpp
            mingw-w64-ucrt-x86_64-libsamplerate
          )
          attempt=1
          max=6
          while true; do
            if pacman -Syuu --noconfirm --disable-download-timeout \
              && pacman -S --needed --noconfirm --overwrite '*' --disable-download-timeout "${pkgs[@]}"; then
              break
            fi
            if (( attempt >= max )); then
              echo "::error::pacman install failed after ${max} attempts (slow/stalled MSYS2 mirrors)"
              exit 1
            fi
            echo "pacman failed (attempt ${attempt}/${max}), retrying..."
            sleep $(( attempt * 20 ))
            attempt=$((attempt + 1))
          done

      - name: Cache libopenshot bundle (MSYS2 UCRT64)
        id: cache-libopenshot-win
        uses: actions/cache@v4
        with:
          path: .ci-deps/openshot-bundle
          key: windows-msys2-libopenshot-v0.7.0-v1-ucrt-${{ hashFiles('.github/workflows/release.yml', 'installer/ci-win-msys-libopenshot.sh', 'installer/patch-libopenshot-ffmpeg.py') }}

      - name: Build unittest-cpp, libopenshot-audio, libopenshot (MSYS2 / README)
        if: steps.cache-libopenshot-win.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          MSYSTEM: UCRT64
        run: bash installer/ci-win-msys-libopenshot.sh

      - name: Export OpenShot bundle path for freeze
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUNDLE="${GITHUB_WORKSPACE}/.ci-deps/openshot-bundle"
          test -f "${BUNDLE}/openshot.py" || { echo "::error::missing ${BUNDLE}/openshot.py"; exit 1; }
          echo "ZENVI_OPENSHOT_PYROOT=${BUNDLE}" >> "${GITHUB_ENV}"
          echo "ZENVI_OPENSHOT_BINDDIR=${BUNDLE}" >> "${GITHUB_ENV}"
          echo "PYTHONPATH=" >> "${GITHUB_ENV}"

      - name: Verify OpenShot Python bindings (MinGW)
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          export PYTHONPATH="${ZENVI_OPENSHOT_PYROOT}"
          /ucrt64/bin/python.exe -u -c "import openshot; print('openshot OK', openshot.OPENSHOT_VERSION_FULL)"

      - name: Python venv and pip deps (README)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd "${GITHUB_WORKSPACE}"
          /ucrt64/bin/python.exe -m venv --system-site-packages .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-noqt.txt
          ./.venv/bin/python -m pip install setuptools wheel PyOpenGL

      - name: Freeze with cx_Freeze
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYSTEM=UCRT64
          export PATH="/ucrt64/bin:$PATH"
          cd "${GITHUB_WORKSPACE}"
          ./.venv/bin/python freeze.py build --git-branch=production

      - name: Verify production env present in frozen build (Supabase)
        shell: powershell
        run: |
          $exeDir = Get-ChildItem -Path "build" -Directory -Filter "exe.*" | Select-Object -First 1
          if (!$exeDir) { throw "cx_Freeze output directory build/exe.* not found" }
          $root = $exeDir.FullName
          $dot = Join-Path $root ".env.production"
          $alias = Join-Path $root "zenvi.production.env"
          if (!(Test-Path $dot) -and !(Test-Path $alias)) {
            throw "Frozen app has no .env.production or zenvi.production.env under $root. CI checkout may be missing .env.production (ensure it is tracked: .gitignore must include !.env.production and the file must be committed)."
          }
          Write-Host "OK: production env file present for frozen build"

      - name: Verify openshot.py in frozen build (SWIG bindings)
        shell: powershell
        run: |
          $exeDir = Get-ChildItem -Path "build" -Directory -Filter "exe.*" | Select-Object -First 1
          if (!$exeDir) { throw "cx_Freeze output directory build/exe.* not found" }
          $libDir = Join-Path $exeDir.FullName "lib"
          $target = Join-Path $libDir "openshot.py"
          if (!(Test-Path $target)) { throw "openshot.py not found at $target" }
          $content = [System.IO.File]::ReadAllText($target, [System.Text.Encoding]::UTF8)
          if ($content -notmatch "class Profile") {
            throw "Verification failed: 'class Profile' missing from frozen lib/openshot.py"
          }
          Write-Host "Verification OK: SWIG openshot.py present in frozen build"

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build with Inno Setup
        run: |

          # Build installer (deterministically name output + package correct cx_Freeze dir)
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $ISCC)) { throw "Inno Setup compiler not found at $ISCC" }

          $exeDir = Get-ChildItem -Path "build" -Directory -Filter "exe.*" | Select-Object -First 1
          if (!$exeDir) { throw "cx_Freeze output directory build/exe.* not found" }
          $pyExeDir = $exeDir.Name

          & $ISCC `
            /DVERSION="${env:VER}" `
            /DPY_EXE_DIR="$pyExeDir" `
            /F"Zenvi-v${env:VER}-x86_64" `
            /O"." `
            installer/windows-installer.iss

          if (!(Test-Path "Zenvi-v${env:VER}-x86_64.exe")) {
            throw "Expected installer Zenvi-v${env:VER}-x86_64.exe not created"
          }
        shell: powershell

      # Optional: Azure Artifact Signing (SmartScreen / known publisher). Configure:
      # 1) GitHub: Settings → Environments → create "release" (name must match job environment).
      # 2) Entra app (same as AZURE_CODESIGNING_CLIENT_ID) → Federated credentials → GitHub Actions
      #    → Entity type Environment → name "release", OR custom subject exactly:
      #      repo:Zenvi-pro/zenvi-core:environment:release
      #    Issuer: https://token.actions.githubusercontent.com
      #    Audience: api://AzureADTokenExchange
      #    Tag patterns (refs/tags/v*) are unreliable; use environment + this job's
      #    `environment: release` instead.
      #    https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure
      # 2) Role "Artifact Signing Certificate Profile Signer" on the certificate profile
      #    (or broader scope per Microsoft docs) for that app's service principal.
      # 3) Repo secrets: AZURE_CODESIGNING_CLIENT_ID, AZURE_CODESIGNING_TENANT_ID,
      #    AZURE_CODESIGNING_SUBSCRIPTION_ID
      # 4) Repo variables: AZURE_CODESIGNING_ENDPOINT (region URL, e.g. https://eus.codesigning.azure.net/),
      #    AZURE_CODESIGNING_ACCOUNT_NAME, AZURE_CODESIGNING_PROFILE_NAME
      # Signing steps run when all three variables are set (secrets cannot be used in `if:`).
      # See: https://github.com/Azure/artifact-signing-action/blob/main/docs/OIDC.md
      - name: Azure login (OIDC for Artifact Signing)
        if: ${{ vars.AZURE_CODESIGNING_ENDPOINT != '' && vars.AZURE_CODESIGNING_ACCOUNT_NAME != '' && vars.AZURE_CODESIGNING_PROFILE_NAME != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CODESIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CODESIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_CODESIGNING_SUBSCRIPTION_ID }}

      - name: Sign Windows installer (Azure Artifact Signing)
        if: ${{ vars.AZURE_CODESIGNING_ENDPOINT != '' && vars.AZURE_CODESIGNING_ACCOUNT_NAME != '' && vars.AZURE_CODESIGNING_PROFILE_NAME != '' }}
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_CODESIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODESIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CODESIGNING_PROFILE_NAME }}
          files: ${{ github.workspace }}\Zenvi-v${{ env.VER }}-x86_64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Zenvi-v*.exe
          if-no-files-found: error

  # ── 5. Create GitHub Release with all artifacts ───────────────────────
  # Run even if some platform builds fail so that successful artifacts
  # are still published.
  release:
    needs: [version, build-linux, build-macos, build-windows]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Download each platform's artifacts separately so that a missing one
      # does not prevent the others from being collected.
      - name: Download Linux artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts (Intel x86_64)
        uses: actions/download-artifact@v4
        with:
          name: macos-package-x86_64
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts (Apple Silicon arm64)
        uses: actions/download-artifact@v4
        with:
          name: macos-package-arm64
          path: dist/
        continue-on-error: true

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist/
        continue-on-error: true

      - name: Ensure at least one artifact exists
        run: |
          mkdir -p dist
          COUNT=$(find dist/ -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No build artifacts found — all platform builds failed"
            exit 1
          fi
          echo "Found $COUNT artifact(s):"
          find dist/ -type f -exec ls -lh {} \;

      - name: Generate checksums
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Remove legacy production release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view production >/dev/null 2>&1; then
            gh release delete production --yes --cleanup-tag || true
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/production" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/production" || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Zenvi v${{ env.VER }}"
          body: |
            ## Downloads

            | Platform | Installer |
            |----------|-----------|
            | **Linux** (AppImage) | `Zenvi-v${{ env.VER }}-x86_64.AppImage` |
            | **Linux** (Debian/Ubuntu) | `Zenvi-v${{ env.VER }}-x86_64.deb` |
            | **macOS** (Intel) | `Zenvi-v${{ env.VER }}-x86_64.dmg` |
            | **macOS** (Apple Silicon) | `Zenvi-v${{ env.VER }}-arm64.dmg` |
            | **Windows** | `Zenvi-v${{ env.VER }}-x86_64.exe` |

            > **Note:** Some platform installers may not be available if the build for that platform is still in progress.

            ## Checksums

            See `SHA256SUMS.txt` for verification.
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
