name: openshot-qt CI Build
on: [push, pull_request]
jobs:
  # Headless unit suite in tests/. Conftest stubs PyQt5 and libopenshot, so
  # this job needs no apt Qt/openshot packages. Landed non-required first;
  # make it a required branch check once it has been green twice on develop.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements-dev.txt
          requirements-noqt.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run unit tests
      run: pytest tests/ -q

    - name: Ruff
      run: ruff check src/classes/

    # Undefined names anywhere in src/ are runtime NameErrors (the lint above
    # only covers src/classes/, which let a dropped import ship in paint/clip.py).
    - name: Ruff (undefined names, all of src)
      run: ruff check --isolated --select F821 src/

    - name: Pyright
      run: pyright

  # tests/ files that ask for a real PyQt5 (pytest.importorskip("PyQt5...")).
  # unit-tests stubs Qt, so conftest ignores them there, and pytest-suite runs
  # without ZENVI_REAL_QT, so they never ran in CI. PyQt5 wheel, offscreen
  # platform, no libopenshot: files that need it skip themselves.
  real-qt-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements-dev.txt
          requirements-noqt.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt "PyQt5>=5.15,<5.16"

    - name: Run real-Qt tests
      env:
        ZENVI_REAL_QT: "1"
        QT_QPA_PLATFORM: offscreen
      run: |
        mapfile -t files < <(grep -l -E "importorskip\(\s*[\"']PyQt5" tests/test_*.py)
        pytest "${files[@]}" -q -rs

  build:
    runs-on: ${{ matrix.os }}
    # The apt/PPA install has hung for hours; fail it instead of holding the PR.
    timeout-minutes: 30
    strategy:
      # One OS timing out must not cancel the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo add-apt-repository ppa:openshot.developers/libopenshot-daily
        sudo apt update
        sudo apt install libopenshot-audio-dev libopenshot-dev python3-openshot
        sudo apt install qttranslations5-l10n libssl-dev xvfb
        sudo apt install python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtwebengine python3-pyqt5.qtopengl python3-zmq python3-xdg
        pip3 install setuptools wheel sentry-sdk
        pip3 install cx_Freeze==7.0.0 distro defusedxml requests certifi chardet urllib3
        pip3 install -r requirements-dev.txt

    - name: Test
      run: |
        python3 ./src/tests/query_tests.py -platform minimal
        python3 ./src/tests/update_installer_tests.py -v
        QT_QPA_PLATFORM=offscreen python3 -m pytest \
          tests/test_path_serialization.py \
          tests/test_generated_media_paths.py \
          tests/test_project_media.py \
          tests/test_media_fingerprint.py \
          tests/test_media_cache.py -q --tb=line

  pytest-suite:
    # Runs the tests/ suite that was previously never executed in CI.
    # Uses the same Ubuntu + libopenshot setup as the legacy build job.
    # Stale tests should be fixed or explicitly pytest.mark.skip'd rather
    # than silently ignored.
    runs-on: ubuntu-24.04
    # The apt/PPA install has hung for hours; fail it instead of holding the PR.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo add-apt-repository ppa:openshot.developers/libopenshot-daily
        sudo apt update
        sudo apt install libopenshot-audio-dev libopenshot-dev python3-openshot
        sudo apt install qttranslations5-l10n libssl-dev xvfb ffmpeg
        sudo apt install python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtwebengine python3-pyqt5.qtopengl python3-zmq python3-xdg
        pip3 install -r requirements-dev.txt

    - name: Generate export fixtures
      run: python3 scripts/generate_export_fixtures.py

    - name: Run pytest suite
      run: |
        # Hard-gate on the export-acceleration suite (new in this plan).
        xvfb-run -a python3 -m pytest tests/test_export_acceleration.py -q --tb=short
        # Real-Qt test that imports the main window, so it needs the libopenshot
        # this job installs (the real-qt-tests job has none and skips it).
        ZENVI_REAL_QT=1 xvfb-run -a python3 -m pytest tests/test_undo_action_routing.py \
          tests/test_project_lock.py tests/test_media_menu_actions.py -q --tb=short
        # Broader suite: continue reporting while stale tests are triaged.
        # Remove continue-on-error once Phase 0 triage makes this green.
        xvfb-run -a python3 -m pytest tests/ -q --tb=line \
          --ignore=tests/smoke_test.py \
          --ignore=tests/test_export_acceleration.py \
          -k "not (mcp or agent_runners or indexing)" || true

  windows-update-installer-tests:
    # Separate job (not added to the matrix above): the Ubuntu job's
    # dependency-install steps are Ubuntu-specific, and this job only needs
    # to validate the Windows-only paths in update_installer_tests.py (the
    # external-updater PowerShell script and spawn logic) — no openshot/PyQt
    # build required, since classes.update_installer deliberately avoids
    # those dependencies.
    runs-on: windows-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Test
      run: python ./src/tests/update_installer_tests.py -v
